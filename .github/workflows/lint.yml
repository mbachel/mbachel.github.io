name: Linting Check

on:
    push:
        branches: ["main","dev"]
    pull_request: 
        branches: ["main","dev"]

    workflow_dispatch:
        inputs:
            fix_errors:
                description: 'Attempt to auto-fix linting errors'
                required: false
                type: boolean
                default: false
            
permissions:
    contents: write

jobs:
    lint:
        name: Lint ${{ inputs.fix_errors && '(Auto-fixing)' || ''}}
        runs-on: ubuntu-latest

        steps:
            - name: Check out code
              uses: actions/checkout@v4
              with:
                ref: ${{ github.head_ref || github.ref_name }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                node-version: '24'
                cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Run Linter (Check)
              if: ${{ !inputs.fix_errors }}
              run: npm run lint

            - name: Run Linter (Auto-fix)
              if: ${{ inputs.fix_errors }}
              run: npm run lint -- --fix

            - name: Commit and Push Fixes
              if: ${{ inputs.fix_errors }}
              uses: stefanzweifel/git-auto-commit-action@v7
              with: 
                commit_message: "style: auto-fix linting errors"
                branch: ${{ github.head_ref || github.ref_name }}
                file_pattern: 'src/**'